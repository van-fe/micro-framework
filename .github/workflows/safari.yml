name: Real macOS Safari
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    # Requires an unlocked desktop with Safari Remote Automation enabled.
    runs-on: [self-hosted, macOS, micro-frame-safari]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run test:safari
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: safari-failure-evidence
          include-hidden-files: true
          path: .vitest-attachments/
