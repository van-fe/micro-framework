name: Performance evidence
on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 0'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - run: bun run benchmark
      - run: bun run benchmark:soak
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: benchmark-results/
          retention-days: 30
